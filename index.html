<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StableRun</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one racecard column. The loud moments are the hero banner and the race stage; every other panel stays quiet and print-like. */
:root{
  color-scheme:light;
  --bg:#EAF0EA; --surface:#F6F9F5; --ink:#0E2A1C; --muted:#4C6556; --line:#C7D5C9;
  --turf:#3E8E58; --turf2:#47A062; --rail:#FFFFFF;
  --accent:#D13A26; --accent-ink:#FFFFFF;
  --gold:#E0A800; --gold-text:#7D5E00; --roll:#3E8E58;
  --tote-bg:#0F2318; --tote-fg:#F5D36B;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}


*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.app{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font:900 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.net{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:4px;align-self:flex-end;padding-bottom:3px}
.wallet{display:inline-flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;font:500 13px var(--f-mono)}
.wallet:hover{border-color:var(--ink)}
.wallet.switch-wallet{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:800}
.wallet .bal{color:var(--gold-text)}

/* step rail */
.rail{list-style:none;margin:0 0 28px;padding:10px 0 0;display:flex;gap:6px;overflow-x:auto;border-top:1px solid var(--line)}
.rail li{display:flex;align-items:center;gap:8px;padding:6px 0;font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rail li+li::before{content:"";width:18px;height:1px;background:var(--line);margin-right:6px}
.rail .n{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;font:500 11px var(--f-mono)}
.rail li.done{color:var(--ink)}
.rail li.done .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail li.now{color:var(--ink)}
.rail li.now .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* type */
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:uppercase;text-wrap:balance}
.hero h1{font-weight:900;font-size:clamp(54px,12vw,120px);line-height:.86;letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{max-width:60ch;color:var(--muted);font-size:17px;margin:18px 0 0}
h2{font-weight:900;font-size:24px;letter-spacing:.02em;line-height:1.05}
.sub{color:var(--muted);margin:6px 0 16px;max-width:60ch}
.lab{display:block;font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
small{color:var(--muted)}

/* hero banner */
.hero{margin-bottom:28px}
.banner{margin-top:26px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.banner canvas,.stagewrap canvas{display:block;width:100%}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;min-width:0}
.grid2,.grid-main{display:grid;gap:20px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.grid-main{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:820px){.grid2,.grid-main{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:20px;min-width:0}

/* buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:4px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.12)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--ink);filter:none}
.btn.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.linkbtn:hover{color:var(--ink)}
input[type=text]{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px 14px;font:500 17px var(--f-body);min-height:46px}
input[type=text]:focus{border-color:var(--ink);outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.stepper button{width:46px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink)}
.stepper button:hover{background:var(--line)}
.stepper output{display:grid;place-items:center;min-width:56px;font:500 22px var(--f-mono)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;font:500 14px var(--f-mono);min-height:42px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{margin-top:18px}
.sum{margin:18px 0 0;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted)}
.sum b{color:var(--ink)}
.msg{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.msg.bad{color:var(--accent)}

/* open races */
.list{list-style:none;margin:0;padding:0}
.open{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.open:first-child{border-top:0;padding-top:0}
.open>div{flex:1;min-width:0;display:grid}
.dots{display:flex;gap:4px}
.dots .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dots .d.on{background:var(--ink);border-color:var(--ink)}
.codeform{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}

/* how it works */
.how{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-top:1px solid var(--line);padding-top:18px;list-style:none;padding-left:0;margin-bottom:0}
.how li{display:grid;gap:4px;align-content:start}
.how b{font:900 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.how span{color:var(--muted);font-size:14px}
.how .k{font:500 12px var(--f-mono);color:var(--accent)}
@media (max-width:700px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* paddock */
.preview{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center;margin-top:12px}
@media (max-width:560px){.preview{grid-template-columns:minmax(0,1fr)}}
.preview canvas{display:block;width:100%;max-width:260px;border:1px solid var(--line);border-radius:4px}
.boostbox .big{font:900 64px/1 var(--f-display);letter-spacing:.01em}
.meter{position:relative;height:10px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold);transition:width .25s}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--surface) calc(25% - 1px) 25%)}
.scale{display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--muted);margin-top:4px}
.tried{margin-top:18px}
.tried .chips{gap:6px}
.tchip{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:14px}
.tchip:hover{border-color:var(--ink)}
.tchip.best{border-color:var(--gold)}
.tchip .mono{color:var(--gold-text);font-size:12px}

/* seats / racecard */
.seats{list-style:none;margin:0;padding:0}
.seat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.seat:first-child{border-top:0}
.seat .no{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:3px;color:#fff;font:900 18px var(--f-display);background:var(--muted)}
.seat .who{flex:1;min-width:0;display:grid;line-height:1.3}
.seat .who b{overflow-wrap:anywhere}
.seat .who small{font-size:12.5px;overflow-wrap:anywhere}
.seat .boost{font:500 13px var(--f-mono);color:var(--gold-text)}
.seat.empty .no{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.seat.empty{color:var(--muted)}
.seat.you .who b::after{content:" · you";font-weight:400;color:var(--muted)}
.tag{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:3px 7px;color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 4px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.codebox{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px dashed var(--muted);border-radius:4px;padding:10px 12px;margin:14px 0}
.codebox b{font:500 20px var(--f-mono);letter-spacing:.06em}
.note{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.proto{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.bigact{display:grid;gap:10px;justify-items:start}
.hash{font:400 12px/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}

/* race stage */
.stagehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.stagehead .mono{font-size:12.5px;color:var(--muted)}
.stagewrap{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.tote{background:var(--tote-bg);color:var(--tote-fg);font:500 14px/1.45 var(--f-mono);padding:12px 14px;display:grid;gap:2px;min-height:82px;align-content:start}
.tote .l0{font-size:16px}
.tote .l1,.tote .l2{opacity:.5}
.board{position:relative;margin-top:16px;border-top:1px solid var(--line)}
.brow{position:absolute;left:0;right:0;height:44px;display:grid;grid-template-columns:34px 28px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:0 4px;border-bottom:1px solid var(--line);transition:transform .4s cubic-bezier(.3,.7,.2,1)}
.brow .pos{font:900 20px var(--f-display);text-align:right}
.brow .no{display:grid;place-items:center;width:26px;height:26px;border-radius:3px;color:#fff;font:900 16px var(--f-display)}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.brow .gap{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.brow .bst{font:500 12.5px var(--f-mono);color:var(--gold-text)}
@media (max-width:520px){.brow .bst{display:none}.brow{grid-template-columns:30px 26px minmax(0,1fr) auto}}
.after{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}

/* result */
.winner{display:grid;gap:6px;margin-bottom:24px}
.winner .nmx{font:900 clamp(48px,11vw,104px)/.88 var(--f-display);text-transform:uppercase;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.winner .nmx i{display:grid;place-items:center;width:.72em;height:.72em;font-style:normal;color:#fff;border-radius:4px;font-size:.8em}
.winner p{margin:8px 0 0;font-size:18px;max-width:60ch}
.winner .lab{color:var(--accent);margin:0}
.scores{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.scores li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.scores .no{display:grid;place-items:center;width:30px;height:30px;border-radius:3px;color:#fff;font:900 18px var(--f-display)}
.scores .nm{font-weight:700;overflow-wrap:anywhere}
.scores .nm small{font-weight:400;margin-left:6px}
.scores .tot{font:500 16px var(--f-mono)}
.scores .bar{grid-column:2 / 4;height:12px;display:flex;background:var(--line);border-radius:2px;overflow:hidden}
.scores .bar i{display:block;height:100%}
.scores .bar .r{background:var(--roll)}
.scores .bar .b{background:var(--gold)}
.scores .split{grid-column:2 / 4;font:400 12px var(--f-mono);color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
pre.share{margin:0 0 12px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:4px;font:400 12.5px/1.55 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.formula{font:500 14px var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0 0 12px;overflow-x:auto}
.net-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.net-line:first-of-type{border-top:0}
.up{color:var(--roll);font-weight:700}
.down{color:var(--accent);font-weight:700}

.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;max-width:78ch}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- additions for the live app ---- */
[hidden]{display:none!important}
:root{color-scheme:light}
select{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px 14px;font:500 16px var(--f-body);min-height:46px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#claimChip{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:8px 12px;font:700 13px var(--f-body);cursor:pointer;min-height:36px}
#claimChip[disabled]{opacity:.5;cursor:not-allowed}
.warn{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--gold);border-radius:6px;padding:12px 14px;margin-bottom:18px}
.warn.bad{border-color:var(--accent)}
.warn span{min-width:0;flex:1 1 260px}
a.btn{text-decoration:none}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--muted);cursor:pointer}
.check input{margin-top:3px;flex:none}
.forfs{margin-top:14px;border-top:1px dashed var(--line);padding-top:6px}
.forf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;color:var(--muted)}
.forf .nm{display:grid;overflow-wrap:anywhere}
.forf small{font-size:12.5px}
.foot a{color:var(--ink)}

/* Wallet chooser */
.wallet-picker{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(5,24,14,.62)}
.wallet-picker[hidden]{display:none}
.wallet-picker-card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:0 24px 80px #061b1080}
.wallet-picker-card h2{margin:0 0 6px;font:900 30px/1.05 var(--f-display);text-transform:uppercase}
.wallet-picker-card p{color:var(--muted);margin:0 0 18px}
.wallet-options{display:grid;gap:9px}
.wallet-options .btn{width:100%;justify-content:flex-start;text-align:left}
.wallet-picker-close{margin-top:14px;width:100%}

.stack{display:grid;gap:20px;min-width:0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 27V14a9 9 0 0 1 18 0v13h-5.5V14a3.5 3.5 0 0 0-7 0v13z" fill="currentColor"/><circle cx="9.7" cy="21" r="1.1" fill="var(--bg)"/><circle cx="9.7" cy="16.5" r="1.1" fill="var(--bg)"/><circle cx="22.3" cy="21" r="1.1" fill="var(--bg)"/><circle cx="22.3" cy="16.5" r="1.1" fill="var(--bg)"/></svg>
      <span>StableRun</span><span class="net" id="netLabel"></span>
    </div>
    <div class="top-right"><button type="button" id="claimChip" hidden></button><button class="wallet" id="wallet" type="button" hidden></button></div>
  </header>
  <div id="notice"></div>
  <ol class="rail" id="rail" aria-label="Race progress" hidden></ol>
  <main id="main"><p class="sub">Loading…</p></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* After deploying, paste your contract address between the quotes and set the network.
   Or leave it blank and enter both on the Settings screen of the page. */

  nextGameId:'0xb135bbb0',getGame:'0xa2f77bcc',getPlayers:'0x460e2049',commitHash:'0xaea89e23',claimable:'0x402914f5',usdc:'0x3e413bee',
  seatOf:'0x2b3dac4c',approve:'0x095ea7b3',allowance:'0xdd62ed3e',balanceOf:'0x70a08231'};
var NETS={
  8453:{name:'Base',hex:'0x2105',rpc:'https://mainnet.base.org',explorer:'https://basescan.org'},
  84532:{name:'Base Sepolia',hex:'0x14a34',rpc:'https://sepolia.base.org',explorer:'https://sepolia.basescan.org'},
  31337:{name:'Local test chain',hex:'0x7a69',rpc:'http://127.0.0.1:8545',explorer:''}
};
var CIRCLE_BASE_USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
var MAXU=(1n<<256n)-1n;
var ST={NONE:0,OPEN:1,REVEALING:2,FINAL:3,CANCELLED:4};
var SEED_LIFETIME=250;

/* ---------- tiny helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};

var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var HORSES=['Gas Fee','Midnight Invoice','Hot Take','Pennywise','Lunchbreak','Cold Brew','Sir Reginald','Dead Cat','Moon Landing','Burnt Toast','Salt Flats','Tuesday','Gravel Rash','Soft Launch','Fiscal Cliff','Last Orders','Sunday Roast','Tin Whistle'];
function h32(str, seed){
  var h=(2166136261 ^ seed)>>>0;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  h^=h>>>15; h=Math.imul(h,2246822507)>>>0; h^=h>>>13; h=Math.imul(h,3266489909)>>>0; h^=h>>>16;
  return h>>>0;
}
var COATS=['#6a3d20','#8b5a2b','#2a211d','#a8743d','#7b7b7b','#c9b58c','#4a2e1c','#8d6b4f'];
function silksFor(addr,name){
  var h=h32(addr.toLowerCase()+'|'+String(name).trim().toLowerCase(),5);
  var hue=h%360, hue2=(hue+140+((h>>>9)%80))%360;
  return {c1:'hsl('+hue+' 72% 44%)', c2:'hsl('+hue2+' 85% 78%)', pattern:(h>>>16)%3, coat:COATS[(h>>>20)%COATS.length]};
}
function ord(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function marginText(w,l){
  var len=(l.T-w.T)/l.T*12.86;
  if(len<0.1) return 'a nose';
  if(len<0.2) return 'a short head';
  if(len<0.35) return 'a head';
  if(len<0.7) return 'a neck';
  if(len<1.2) return 'a length';
  var q=Math.round(len*4)/4, whole=Math.floor(q), fr=q-whole;
  var f=fr===0.25?'¼':fr===0.5?'½':fr===0.75?'¾':'';
  return whole+f+' lengths';
}
function usd(u){ var s=(Number(u)/1e6).toFixed(6).replace(/0+$/,'').replace(/\.$/,''); return s===''?'0':s; }
function parseUsd(str){
  str=String(str).trim();
  if(!/^\d{1,9}(\.\d{1,6})?$/.test(str)) return null;
  var p=str.split('.'), whole=BigInt(p[0]), frac=BigInt(((p[1]||'')+'000000').slice(0,6));
  var v=whole*1000000n+frac;
  return v>=10000n?v:null;
}
function mmss(sec){ sec=Math.max(0,Math.floor(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function hms(sec){ sec=Math.max(0,Math.floor(sec)); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60); return h+'h '+String(m).padStart(2,'0')+'m'; }


/* ---------- race motion (same maths as the prototype) ---------- */
function progress(r,tau){
  var u=Math.min(1,Math.max(0,tau/r.T));
  return u+r.A1/(r.k1*Math.PI)*Math.sin(r.k1*Math.PI*u)+r.A2/(r.k2*Math.PI)*Math.sin(r.k2*Math.PI*u);
}
function speedAt(r,tau){
  var u=Math.min(1,Math.max(0,tau/r.T));
  return (1+r.A1*Math.cos(r.k1*Math.PI*u)+r.A2*Math.cos(r.k2*Math.PI*u))/r.T;
}

/* ---------- ABI by hand (only what this app needs) ---------- */
var W=function(v){return BigInt(v).toString(16).padStart(64,'0');};
var addrW=function(a){return a.toLowerCase().replace(/^0x/,'').padStart(64,'0');};
function encStr(s){
  var b=new TextEncoder().encode(s), hex='';
  for(var i=0;i<b.length;i++) hex+=b[i].toString(16).padStart(2,'0');
  return W(b.length)+hex.padEnd(Math.max(64,Math.ceil(hex.length/64)*64),'0');
}
function words(hex){ var d=hex.replace(/^0x/,''), out=[]; for(var i=0;i+64<=d.length;i+=64) out.push(d.slice(i,i+64)); return out; }
function wAddr(w){ return '0x'+w.slice(24); }
function wNum(w){ return BigInt('0x'+w); }
function decodeGame(hex){
  var w=words(hex); if(w.length<11) return null;
  return {host:wAddr(w[0]),stake:wNum(w[1]),maxPlayers:Number(wNum(w[2])),status:Number(wNum(w[3])),joinDeadline:Number(wNum(w[4])),
    revealDeadline:Number(wNum(w[5])),playerCount:Number(wNum(w[6])),revealedCount:Number(wNum(w[7])),winner:wAddr(w[8]),seed:'0x'+w[9],seedBlock:Number(wNum(w[10]))};
}
function decodeStr(d,wordIdx){
  var len=Number(wNum(d.slice(wordIdx*64,wordIdx*64+64))), hex=d.slice(wordIdx*64+64,wordIdx*64+64+len*2), b=new Uint8Array(len);
  for(var i=0;i<len;i++) b[i]=parseInt(hex.substr(i*2,2),16);
  return new TextDecoder().decode(b);
}
function decodePlayers(hex){
  var d=hex.replace(/^0x/,''), W_=function(i){return d.slice(i*64,i*64+64);};
  var arr=Number(wNum(W_(0)))/32, n=Number(wNum(W_(arr))), out=[];
  for(var i=0;i<n;i++){
    var start=arr+1+Number(wNum(W_(arr+1+i)))/32;
    out.push({wallet:wAddr(W_(start)).toLowerCase(),revealed:wNum(W_(start+1))===1n,boost:Number(wNum(W_(start+2))),roll:Number(wNum(W_(start+3))),
      score:Number(wNum(W_(start+4))),commit:'0x'+W_(start+5),name:decodeStr(d,start+Number(wNum(W_(start+7)))/32)});
  }
  return out;
}
function revertReason(err){
  var data=(err&&(err.data&&(err.data.data||err.data)))||(err&&err.error&&err.error.data)||(err&&err.info&&err.info.error&&err.info.error.data);
  if(typeof data==='object'&&data&&data.data) data=data.data;
  if(typeof data==='string'&&data.indexOf('0x08c379a0')===0){
    try{ return decodeStr(data.slice(10),1); }catch(e){}
  }
  var m=String((err&&err.message)||'').match(/execution reverted:?\s*([^"\n]*)/i);
  return m&&m[1]?m[1].trim():'';
}
function friendly(err){
  if(err&&(err.code===4001||err.code==='ACTION_REJECTED')) return 'You cancelled the request in your wallet.';
  var r=revertReason(err);
  var map={
    'USDC transferFrom failed (approve first?)':'USDC approval is missing, or your USDC balance is too low.',
    'game id changed, try again':'Someone else created a race at the same moment. Try again.',
    'USDC not found on this network':'This contract cannot find USDC on this network. Check the network and the contract address.',
    'reveal window still open':'Not yet. Everyone still has time to reveal.',
    'wait for the next block':'Wait a couple of seconds for the next block, then press again.',
    'name already taken in this race':'Another horse in this race already has that name.',
    'name has an invalid character':'Letters, numbers, spaces, apostrophes and hyphens only.',
    'join window closed':'This race is no longer open to new players.',
    'game is not open':'This race is no longer open to new players.'
  };
  if(r) return map[r]||r;
  return (err&&err.message)?String(err.message).slice(0,200):'Something went wrong.';
}

/* ---------- JSON-RPC through the wallet ---------- */
function rpc(method,params){ return S.provider.request({method:method,params:params||[]}); }   // wallet only: signing, sending, receipts
var BASE_RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];
function isRate(e){ var m=String(e&&e.message||''); return !!(e&&(e.code===-32005||e.code===429))||/rate.?limit|too many|429|exceeded/i.test(m); }
function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function publicRpcs(){ if(Number(S.cfg.chainId)===8453) return BASE_RPCS; return (S.cfg.rpcs&&S.cfg.rpcs.length)?S.cfg.rpcs:null; }
async function viaWallet(method,params){
  var delays=[700,1600,3200];
  for(var t=0;;t++){
    try{ return await rpc(method,params); }
    catch(e){ if(!isRate(e)||t>=delays.length) throw e; await sleep(delays[t]); }
  }
}
async function viaPublic(method,params){
  var urls=publicRpcs(), last;
  if(!urls) return viaWallet(method,params);
  for(var k=0;k<urls.length;k++){
    var idx=((S.rpcIdx||0)+k)%urls.length, ctl=new AbortController(), tm=setTimeout(function(){ctl.abort();},8000);
    try{
      var r=await fetch(urls[idx],{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:method,params:params}),signal:ctl.signal});
      if(!r.ok) throw new Error('RPC '+r.status);
      var j=await r.json();
      if(j.error){ var er=new Error(j.error.message||'RPC error'); er.code=j.error.code; er.data=j.error.data; throw er; }
      S.rpcIdx=idx; return j.result;
    }catch(e){ last=e; if(e&&e.code!==undefined&&!isRate(e)&&e.code!==-32603) throw e; }
    finally{ clearTimeout(tm); }
  }
  try{ return await viaWallet(method,params); }catch(e){ throw last||e; }
}
async function readMany(reqs){   // one HTTP request for many eth_calls
  var urls=publicRpcs(), last;
  if(!urls) return Promise.all(reqs.map(function(q){ return viaWallet(q.method,q.params); }));
  var body=reqs.map(function(q,i){return {jsonrpc:'2.0',id:i+1,method:q.method,params:q.params};});
  for(var k=0;k<urls.length;k++){
    var idx=((S.rpcIdx||0)+k)%urls.length, ctl=new AbortController(), tm=setTimeout(function(){ctl.abort();},10000);
    try{
      var r=await fetch(urls[idx],{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
      if(!r.ok) throw new Error('RPC '+r.status);
      var out=await r.json(); if(!Array.isArray(out)) out=[out];
      var by={}; out.forEach(function(o){by[o.id]=o;});
      var res=reqs.map(function(q,i){ var o=by[i+1]; if(!o) throw new Error('The network gave no answer'); if(o.error){ var er=new Error(o.error.message||'RPC error'); er.code=o.error.code; throw er; } return o.result; });
      S.rpcIdx=idx; return res;
    }catch(e){ last=e; }
    finally{ clearTimeout(tm); }
  }
  throw last||new Error('Could not reach Base');
}
/* Background reads (polling, lists) go to public Base nodes so they never use up the wallet's own request allowance.
   Calls made right before signing pass from=account and use the wallet's node, which sees the freshest state. */
function ethCall(to,data,from){
  var p={to:to,data:data}; if(from) p.from=from;
  return (from?viaWallet:viaPublic)('eth_call',[p,'latest']);
}
function chainNow(){ return S.clock.ts+(Date.now()-S.clock.at)/1000; }
async function refreshClock(){
  var b=await viaPublic('eth_getBlockByNumber',['latest',false]);
  S.clock={block:parseInt(b.number,16),ts:parseInt(b.timestamp,16),at:Date.now()};
}
async function waitReceipt(hash){
  for(var i=0;i<160;i++){
    var rc; try{ rc=await rpc('eth_getTransactionReceipt',[hash]); }catch(e){ if(!isRate(e)) throw e; }
    if(rc) return rc;
    await new Promise(function(r){setTimeout(r,1500);});
  }
  throw new Error('Still waiting for the network. Check your wallet for the transaction status.');
}
async function send(to,data,label){
  setBusy(label+': check your wallet…');
  try{ await ethCall(to,data,S.account); }catch(e){ if(!isRate(e)){ setBusy(''); throw new Error(friendly(e)); } }
  var hash;
  try{ hash=await rpc('eth_sendTransaction',[{from:S.account,to:to,data:data}]); }catch(e){ setBusy(''); throw new Error(friendly(e)); }
  setBusy(label+': waiting for the network…');
  try{
    var rc=await waitReceipt(hash);
    if(rc.status!=='0x1') throw new Error('The transaction failed on chain.');
    return rc;
  } finally { setBusy(''); }
}
function setBusy(t){ S.busy=t; render(); }

/* ---------- wallet connection ---------- */
function discoverProviders(){
  return new Promise(function(res){
    var found=[];
    function onAnn(e){ if(e&&e.detail&&e.detail.provider) found.push(e.detail); }
    window.addEventListener('eip6963:announceProvider',onAnn);
    window.dispatchEvent(new Event('eip6963:requestProvider'));
    setTimeout(function(){
      window.removeEventListener('eip6963:announceProvider',onAnn);
      if(!found.length&&window.ethereum) found.push({info:{name:'Browser wallet',uuid:'window.ethereum'},provider:window.ethereum});
      res(found);
    },250);
  });
}
async function useProvider(detail,prompt){
  S.provider=detail.provider; S.providerName=detail.info.name;
  var accts=await rpc(prompt?'eth_requestAccounts':'eth_accounts',[]);
  if(!accts||!accts.length){ S.provider=null; return false; }
  S.account=String(accts[0]).toLowerCase();
  try{ localStorage.setItem('stablerun:wallet',detail.info.uuid); }catch(e){}
  if(S.provider.on&&!S.provider.__stableRunBound){
    S.provider.__stableRunBound=true;
    S.provider.on('accountsChanged',function(accounts){
      S.account=accounts&&accounts.length?String(accounts[0]).toLowerCase():null;
      S.ready=false; S.notice=null; S.sig='';
      if(S.account){ run(async function(){ await afterConnect(); }); }
      else { S.balance=0n; S.claimable=0n; S.recent=null; S.sig=''; render(); }
    });
    S.provider.on('chainChanged',function(chainHex){
      S.chainId=parseInt(chainHex,16); S.ready=false; S.notice=null; S.sig='';
      if(S.account) run(async function(){ await afterConnect(); }); else render();
    });
  }
  return true;
}
async function afterConnect(){
  S.chainId=parseInt(await rpc('eth_chainId',[]),16);
  if(S.chainId!==Number(S.cfg.chainId)){ S.ready=false; S.notice={kind:'switch'}; render(); return; }
  var code=await rpc('eth_getCode',[S.cfg.contract,'latest']);
  if(!code||code==='0x'){ S.ready=false; S.notice={kind:'nocontract'}; render(); return; }
  try{ S.usdc=wAddr(words(await ethCall(S.cfg.contract,SEL.usdc))[0]).toLowerCase(); }catch(e){ S.ready=false; S.notice={kind:'nocontract'}; render(); return; }
  S.notice=null;
  if(Number(S.cfg.chainId)===8453&&S.usdc!==CIRCLE_BASE_USDC) S.notice={kind:'badtoken'};
  S.ready=true;
  await refreshAll();
  startPolling();
  render();
}
async function switchChain(){
  var n=net();
  try{ await rpc('wallet_switchEthereumChain',[{chainId:n.hex}]); }
  catch(e){
    if(e&&e.code===4902&&n.rpc){
      try{ await rpc('wallet_addEthereumChain',[{chainId:n.hex,chainName:n.name,rpcUrls:[n.rpc],nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},blockExplorerUrls:n.explorer?[n.explorer]:[]}]); }
      catch(e2){ toast(friendly(e2)); }
    } else toast(friendly(e));
  }
}

/* ---------- chain reads ---------- */
async function loadGame(id){
  var gh=await ethCall(S.cfg.contract,SEL.getGame+W(id));
  var g=decodeGame(gh);
  if(!g||g.status===ST.NONE) return null;
  var players=decodePlayers(await ethCall(S.cfg.contract,SEL.getPlayers+W(id)));
  g.id=id; g.code='#'+id; g.players=players;
  g.me=players.findIndex(function(p){return p.wallet===S.account;});
  g.hasSecret=!!loadSecret(id);
  return g;
}
async function refreshBalances(){
  S.claimable=BigInt(await ethCall(S.cfg.contract,SEL.claimable+addrW(S.account)));
  S.balance=BigInt(await ethCall(S.usdc,SEL.balanceOf+addrW(S.account)));
}
async function loadRecent(){
  var next=Number(BigInt(await ethCall(S.cfg.contract,SEL.nextGameId)));
  var ids=[]; for(var i=next-1;i>=1&&ids.length<20;i--) ids.push(i);
  var reqs=[];
  ids.forEach(function(id){
    reqs.push({method:'eth_call',params:[{to:S.cfg.contract,data:SEL.getGame+W(id)},'latest']});
    reqs.push({method:'eth_call',params:[{to:S.cfg.contract,data:SEL.seatOf+W(id)+addrW(S.account)},'latest']});
  });
  var res=reqs.length?await readMany(reqs):[];
  S.recent=ids.map(function(id,k){ var g=decodeGame(res[k*2]); g.id=id; g.seat=Number(BigInt(res[k*2+1])); return g; });
}
async function refreshAll(){
  await refreshClock();
  await refreshBalances();
  if(S.route.name==='game'){
    var prev=S.game&&S.game.id===S.route.id?S.game.status:null;
    var g=await loadGame(S.route.id);
    if(g&&prev===ST.REVEALING&&g.status===ST.FINAL&&g.revealedCount>=2) S.watching=true;
    S.game=g;
    if(g&&g.status===ST.FINAL&&g.revealedCount>=2) buildRace(g);
  } else {
    S.game=null; await loadRecent();
  }
}
function startPolling(){
  if(S.pollId) return;
  S.pollId=setInterval(async function(){
    if(S.polling||!S.ready||document.hidden||S.busy||Date.now()<(S.backoffUntil||0)) return;
    if(S.route.name!=='game'&&Date.now()-(S.lastPoll||0)<8000) return;   // the lobby is the heavy one: every 8s, races every 2.5s
    S.lastPoll=Date.now(); S.polling=true;
    try{ await refreshAll(); render(); }catch(e){ if(isRate(e)) S.backoffUntil=Date.now()+12000; }
    S.polling=false;
  },2500);
  setInterval(tick,1000);
}

/* ---------- race data from chain results ---------- */
function buildRace(g){
  var seats=[], rows=[];
  g.players.forEach(function(p,i){ if(p.revealed) seats.push({addr:p.wallet,owner:short(p.wallet),name:p.name,boost:p.boost/100,silks:silksFor(p.wallet,p.name),you:p.wallet===S.account,pi:i}); });
  var maxPts=Math.max.apply(null,seats.map(function(s){return g.players[s.pi].score/100;}));
  seats.forEach(function(s,i){
    var p=g.players[s.pi], pts=p.score/100, h=h32(g.seed+'|'+p.wallet,21);
    var r={idx:i,roll:p.roll/100,boost:p.boost/100,score:pts,T:16+(maxPts-pts)*0.06,k1:1+(h%4),k2:1+((h>>>3)%5),A1:((h>>>6)%111)/100-0.55,A2:((h>>>13)%71)/100-0.35};
    if(r.k2===r.k1) r.k2=(r.k2%5)+1;
    rows.push(r);
  });
  var order=rows.slice().sort(function(a,b){return b.score-a.score||a.idx-b.idx;});
  order.forEach(function(r,i){r.rank=i+1;});
  S.raceSeats=seats; S.race={rows:rows,order:order,seed:g.seed,tx:''};
}
var pool=function(){ var g=S.game; return usd(g.stake*BigInt(g.playerCount)); };

function darken(hex,f){ var n=parseInt(hex.slice(1),16); var c=function(v){return Math.round(v*f);}; return 'rgb('+c((n>>16)&255)+','+c((n>>8)&255)+','+c(n&255)+')'; }
function themeColors(){

  return {surface:g('--surface'),turf:g('--turf'),turf2:g('--turf2'),rail:g('--rail'),muted:g('--muted'),accent:g('--accent'),gold:g('--gold'),ink:g('--ink')};
}
// Horse faces right. cx = body centre, gy = ground. Nose sits 38 units ahead of cx, tail 33 behind.
function drawHorse(ctx,cx,gy,s,ph,m,sk,num){
  ctx.save();
  ctx.translate(cx,gy-m*Math.abs(Math.sin(ph))*1.8*s);
  ctx.scale(s,s);
  ctx.lineCap='round'; ctx.lineJoin='round';
  var coat=sk.coat, dk=darken(coat,0.62), mane='#1b130e';
  function leg(ax,off,col){
    var ay=-17, p=ph+off, tu=m*0.65*Math.sin(p), tl=tu-m*(0.55+0.55*Math.sin(p-0.9));
    var kx=ax+Math.sin(tu)*9, ky=ay+Math.cos(tu)*9, hx=kx+Math.sin(tl)*9, hy=ky+Math.cos(tl)*9;
    ctx.strokeStyle=col; ctx.lineWidth=3.4; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(kx,ky); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.fillStyle=mane; ctx.beginPath(); ctx.arc(hx,hy,1.9,0,7); ctx.fill();
  }
  leg(13,3.0,dk); leg(-13,0,dk);
  ctx.strokeStyle=mane; ctx.lineWidth=3.4; ctx.beginPath(); ctx.moveTo(-18,-27);
  ctx.quadraticCurveTo(-27,-28+Math.sin(ph*2)*2*m,-33,-20+Math.sin(ph*2+1)*3*m); ctx.stroke();
  ctx.fillStyle=coat; ctx.beginPath(); ctx.ellipse(0,-23,20,9.5,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10,-28); ctx.lineTo(24,-44); ctx.lineTo(29,-40); ctx.lineTo(17,-19); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(30,-40); ctx.rotate(0.75); ctx.beginPath(); ctx.ellipse(3,0,8,3.8,0,0,7); ctx.fill(); ctx.restore();

VIEWFN.race=function(){

    var s=S.raceSeats[i];
    rows+='<div class="brow" id="br'+i+'" style="transform:translateY('+(i*44)+'px)"><span class="pos mono">–</span><span class="no" style="background:'+s.silks.c1+'">'+(i+1)+'</span><span class="nm">'+esc(s.name)+'</span><span class="bst"></span><span class="gap mono"></span></div>';
  }

    '<div class="stagewrap"><canvas id="track" aria-label="Animated horse race"></canvas><div class="tote" id="tote" aria-live="polite"><span class="l0">Horses are loading into the stalls.</span></div></div>'+
    '<div class="board" id="board" style="height:'+(n*44)+'px">'+rows+'</div>'+
    '<div class="after"><button type="button" class="btn hot" data-act="result" id="afterBtn" hidden>See the result</button><button type="button" class="linkbtn" data-act="skip">Skip to result</button></div>';
};
function geo(W,n){
  var narrow=W<520, laneH=narrow?42:52, top=narrow?30:34, left=narrow?64:92, right=narrow?54:100;
  return {W:W,n:n,narrow:narrow,laneH:laneH,top:top,left:left,finishX:W-right,s:laneH/54,H:top+n*laneH+22};
}
INIT.race=function(){
  var R=S.race, G=S.game, n=S.raceSeats.length, rows=R.rows;
  var cv=$('#track'), wrap=cv.parentElement, ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1), g;
  function setup(){ var W=Math.max(300,Math.floor(wrap.clientWidth)); g=geo(W,n); cv.width=Math.round(W*dpr); cv.height=Math.round(g.H*dpr); cv.style.height=g.H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  setup();
  var C=themeColors(), fr=0, tote=$('#tote'), lastBoard=0;
  var winnerT=R.order[0].T, close=n>1&&(R.order[1].T-R.order[0].T)<0.35;
  var st={tau:-3,msgs:[],lastMsg:-9,prevRank:null,prevIdx:null,fin:rows.map(function(){return false;}),nFin:0,ph:rows.map(function(){return 0;}),dust:[],conf:[],flash:0,half:false,last:false,slow:false};
  var nm=function(i){return S.raceSeats[i].name;};
  function say(t){ st.msgs.unshift(t); st.msgs=st.msgs.slice(0,3); st.lastMsg=st.tau; tote.innerHTML=st.msgs.map(function(m,k){return '<span class="l'+k+'">'+esc(m)+'</span>';}).join(''); }
  function laneGround(i){ return g.top+i*g.laneH+g.laneH-5; }

  startLoop(function(dt){
    fr++; if(fr%90===0) C=themeColors();
    if(wrap.clientWidth>0&&Math.floor(wrap.clientWidth)!==g.W) setup();
    var scale=1;
    if(!RM&&close&&st.tau>0){ var lead0=0; rows.forEach(function(r){lead0=Math.max(lead0,progress(r,st.tau));}); if(lead0>0.9&&st.tau<winnerT+0.9) scale=0.5; }
    st.slow=scale<1;
    var prevTau=st.tau; st.tau+=dt*scale; var tau=st.tau;
    if(prevTau<0&&tau>=0) say("They're off!");

    var P=[],V=[],B=[];
    rows.forEach(function(r,i){
      var done=tau>=r.T;
      P[i]=tau<0?0:progress(r,tau);
      V[i]=tau<0?0:done?Math.exp(-(tau-r.T)*1.6):speedAt(r,tau)*16;
      B[i]=done?38*(1-Math.exp(-(tau-r.T)*2.4)):0;
      if(V[i]>0.02) st.ph[i]+=dt*scale*(3+8*V[i]);
    });

    // ranking
    var keys=rows.map(function(r,i){return tau>=r.T?2-r.T/100:P[i];});
    var idxs=rows.map(function(_,i){return i;}).sort(function(a,b){return keys[b]-keys[a];});
    var rank=[]; idxs.forEach(function(ix,k){rank[ix]=k;});

    // commentary
    var leadP=P[idxs[0]];
    if(st.nFin===0&&tau>1&&tau-st.lastMsg>1.8){
      if(!st.half&&leadP>=0.5){ st.half=true; say('Halfway. '+nm(idxs[0])+' leads.'); }
      else if(!st.last&&leadP>=0.83){ st.last=true; say('Into the final furlong. '+nm(idxs[0])+' in front.'); }
      else if(st.prevRank){
        if(idxs[0]!==st.prevIdx[0]) say(nm(idxs[0])+' goes to the front');
        else { for(var k=1;k<Math.min(3,n);k++){ var h=idxs[k]; if(st.prevRank[h]>k){ say(nm(h)+' moves up to '+ord(k+1)); break; } } }
      }
    }
    st.prevRank=rank; st.prevIdx=idxs;

    // finishes
    rows.forEach(function(r,i){
      if(!st.fin[i]&&tau>=r.T){
        st.fin[i]=true; st.nFin++;
        if(r.rank===1){
          say(n>1?nm(i)+' wins by '+marginText(r,R.order[1])+'!':nm(i)+' wins!'); st.flash=1;
          if(!RM){ var cnt=S.raceSeats[i].you?130:70; for(var c=0;c<cnt;c++){ st.conf.push({x:g.finishX+rnd(-40,40),y:g.top-10,vx:rnd(-160,160),vy:rnd(-260,-40),rot:rnd(0,6),vr:rnd(-8,8),col:c%2?S.raceSeats[i].silks.c1:S.raceSeats[i].silks.c2,life:rnd(2,3.6)}); } }
        } else if(r.rank<=3){ say(nm(i)+' takes '+ord(r.rank)); }
      }
    });
    if(tau>=winnerT+1.2){ var ab=$('#afterBtn'); if(ab&&ab.hidden) ab.hidden=false; }

    // draw track
    var W=g.W, y0=g.top-6, y1=g.top+n*g.laneH+4;
    ctx.fillStyle=C.surface; ctx.fillRect(0,0,W,g.H);
    paintTurf(ctx,W,y0,y1,C,0); paintRails(ctx,W,y0,y1,C);
    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1; ctx.setLineDash([8,10]);
    for(var l=1;l<n;l++){ ctx.beginPath(); ctx.moveTo(0,g.top+l*g.laneH); ctx.lineTo(W,g.top+l*g.laneH); ctx.stroke(); }
    ctx.setLineDash([]);
    // furlong poles
    ctx.font='500 10px "JetBrains Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    for(var f=5;f>=1;f--){ var fx=g.left+(g.finishX-g.left)*((6-f)/6); ctx.fillStyle=C.rail; ctx.fillRect(fx-1,y0-12,2,12); ctx.fillStyle=C.muted; ctx.fillText(f+'f',fx,y0-16); }
    // stalls
    var open=tau<0?0:Math.min(1,tau/0.6);
    ctx.strokeStyle='#323b36'; ctx.lineWidth=3;
    for(var q=0;q<=n;q++){ var qy=g.top+q*g.laneH; ctx.beginPath(); ctx.moveTo(g.left-52,qy); ctx.lineTo(g.left-9,qy); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(g.left-9,y0+6); ctx.lineTo(g.left-9,y1-2); ctx.stroke();
    if(open<1){ ctx.globalAlpha=1-open; ctx.strokeStyle='#e8eee9'; ctx.lineWidth=2; for(var d=0;d<n;d++){ var dy=g.top+d*g.laneH; ctx.beginPath(); ctx.moveTo(g.left-7,dy+8); ctx.lineTo(g.left-7,dy+g.laneH-3); ctx.stroke(); } ctx.globalAlpha=1; }
    // lane plates
    if(!g.narrow){ for(var pl=0;pl<n;pl++){ var py=g.top+pl*g.laneH+(g.laneH-18)/2; ctx.fillStyle=S.raceSeats[pl].silks.c1; ctx.fillRect(6,py,18,18); ctx.fillStyle='#fff'; ctx.font='900 14px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(pl+1),15,py+9.5); } }
    // finish line
    for(var cy=y0,ci=0;cy<y1;cy+=8,ci++){ ctx.fillStyle=ci%2?'#111':'#fff'; ctx.fillRect(g.finishX,cy,4,Math.min(8,y1-cy)); ctx.fillStyle=ci%2?'#fff':'#111'; ctx.fillRect(g.finishX+4,cy,4,Math.min(8,y1-cy)); }
    ctx.fillStyle=C.accent; ctx.font='900 12px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText('FINISH',g.finishX+4,y0-16);
    if(st.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(st.flash*0.35)+')'; ctx.fillRect(g.finishX-30,y0,60,y1-y0); st.flash=Math.max(0,st.flash-dt*1.4); }

    // horses (back lane first)
    for(var i2=0;i2<n;i2++){
      var nose=g.left+(g.finishX-g.left)*P[i2]+B[i2], cx=nose-38*g.s, gy=laneGround(i2);
      var m=Math.min(1,V[i2]*1.1);
      drawHorse(ctx,cx,gy,g.s,st.ph[i2],m,S.raceSeats[i2].silks,i2+1);
      var tail=cx-33*g.s-5;
      if(tau>0.3){
        ctx.font='700 '+(g.narrow?10:11)+'px "Hanken Grotesk",sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
        var tw=ctx.measureText(S.raceSeats[i2].name).width;
        if(tail-tw>4&&!st.fin[i2]){ ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.strokeText(S.raceSeats[i2].name,tail,gy-16*g.s); ctx.fillStyle='#fff'; ctx.fillText(S.raceSeats[i2].name,tail,gy-16*g.s); }
      }
      if(st.fin[i2]){
        var rk=rows[i2].rank, label=ord(rk); ctx.font='900 13px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        var bw=ctx.measureText(label).width+12, bx=Math.min(W-bw/2-4,g.finishX+bw/2+14), by=gy-g.laneH*0.55;
        ctx.fillStyle=rk===1?C.gold:'rgba(10,20,14,.78)'; ctx.fillRect(bx-bw/2,by-9,bw,18); ctx.fillStyle=rk===1?'#1a1200':'#fff'; ctx.fillText(label,bx,by+0.5);
      }
      if(!RM&&V[i2]>0.35&&Math.random()<0.45&&st.dust.length<220) st.dust.push({x:cx-30*g.s,y:gy-2,vx:-rnd(30,80),vy:-rnd(5,30),life:0.5,max:0.5,r:rnd(1.5,3.2)});
    }
    // dust
    for(var di=st.dust.length-1;di>=0;di--){ var p=st.dust[di]; p.life-=dt; if(p.life<=0){ st.dust.splice(di,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; ctx.fillStyle='rgba(222,206,170,'+(p.life/p.max*0.45)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    // confetti
    for(var ci2=st.conf.length-1;ci2>=0;ci2--){ var c2=st.conf[ci2]; c2.life-=dt; c2.vy+=420*dt; c2.x+=c2.vx*dt; c2.y+=c2.vy*dt; c2.rot+=c2.vr*dt; if(c2.life<=0||c2.y>g.H+10){ st.conf.splice(ci2,1); continue; } ctx.save(); ctx.translate(c2.x,c2.y); ctx.rotate(c2.rot); ctx.fillStyle=c2.col; ctx.fillRect(-3,-1.5,6,3); ctx.restore(); }
    // overlays
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(tau<0||tau<0.9){
      var txt=tau<0?(Math.ceil(-tau)<=3?String(Math.ceil(-tau)):''):'GO!';
      if(txt){ var fracT=tau<0?(-tau)%1:tau/0.9, sc=1+0.25*(tau<0?(1-fracT):0); ctx.save(); ctx.translate(W/2,g.H/2); ctx.scale(sc,sc); ctx.font='900 '+(g.narrow?72:96)+'px "Big Shoulders Display",Impact,sans-serif'; ctx.lineWidth=7; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.strokeText(txt,0,0); ctx.fillStyle='#fff'; ctx.fillText(txt,0,0); ctx.restore(); }
    }
    if(st.slow&&!st.fin[idxs[0]]){ ctx.font='900 22px "Big Shoulders Display",Impact,sans-serif'; ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(W/2-72,6,144,26); ctx.fillStyle=(fr%24<14)?C.gold:'#fff'; ctx.fillText('PHOTO FINISH',W/2,19.5); }

    // leaderboard
    lastBoard+=dt;
    if(lastBoard>0.1){
      lastBoard=0;
      rows.forEach(function(r,i){
        var el=$('#br'+i); if(!el) return;
        el.style.transform='translateY('+(rank[i]*44)+'px)';
        el.querySelector('.pos').textContent=st.fin[i]?ord(r.rank):String(rank[i]+1);
        var gapEl=el.querySelector('.gap');
        gapEl.textContent=st.fin[i]?'Finished':tau<0?'':rank[i]===0?'Leader':'−'+((P[idxs[0]]-P[i])*12.86).toFixed(1)+' len';
      });
    }
  });
};

var norm=function(s){return String(s).trim().replace(/\s+/g,' ');};

  if(!/^[A-Za-z0-9 '\-]+$/.test(v)) return 'Letters, numbers, spaces, apostrophes and hyphens only.';

function computeSig(){
  var g=S.game, parts=[S.ready,S.account,S.notice&&S.notice.kind,S.route.name,S.route.id,S.busy,S.watching,S.claimable>0n,String(S.balance),S.providers.length,S.booted];

}

  if(!S.ready&&S.notice&&S.notice.kind==='switch') return {html:lobbyHtml(),init:function(){ heroInit(); updateCreateForm(); }};
  if(!S.ready) return {html:'<section class="panel"><h2>Loading your stable</h2><p class="sub">Checking your wallet and the StableRun contract…</p></section>'};
  if(S.route.name==='lobby') return {html:lobbyHtml(),init:function(){ heroInit(); updateCreateForm(); }};

  var g=S.game;

function resultHtml(g){
  var n=g.playerCount, ws=g.players.filter(function(p){return p.wallet===g.winner.toLowerCase();})[0]||{name:'?',wallet:g.winner};
  var potU=g.stake*BigInt(n), potS=usd(potU), you=g.me>=0?g.players[g.me]:null, youWon=you&&you.wallet===g.winner.toLowerCase();
  var ranked=g.players.map(function(p,i){return {p:p,i:i};}).filter(function(x){return x.p.revealed;}).sort(function(a,b){return b.p.score-a.p.score||a.i-b.i;});
  var line=g.revealedCount===1?'Only '+esc(ws.name)+' revealed, so they win the pot by default.':'The winner takes the '+potS+' USDC pool.';
  if(youWon) line+=' That is your horse. Claim your USDC below.';
  var scoreRows=ranked.map(function(x,k){
    var p=x.p, sk=silksFor(p.wallet,p.name);
    var detail=g.revealedCount>1?'<div class="bar" role="img" aria-label="Roll '+(p.roll/100).toFixed(2)+' plus boost '+(p.boost/100).toFixed(2)+'"><i class="r" style="width:'+(p.roll/100/112*100)+'%"></i><i class="b" style="width:'+(p.boost/100/112*100)+'%"></i></div><span class="split">roll '+(p.roll/100).toFixed(2)+' + boost '+(p.boost/100).toFixed(2)+'</span>':'<span class="split">boost +'+(p.boost/100).toFixed(2)+'</span>';
    return '<li><span class="no" style="background:'+sk.c1+'">'+(x.i+1)+'</span><span class="nm">'+ord(k+1)+' · '+esc(p.name)+'<small>'+short(p.wallet)+'</small></span><span class="tot">'+(g.revealedCount>1?(p.score/100).toFixed(2):'–')+'</span>'+detail+'</li>';
  }).join('');
  var forf=g.players.filter(function(p){return !p.revealed;}).map(function(p){return '<li class="forf"><span class="nm">'+esc(p.name)+'<small>'+short(p.wallet)+'</small></span><span class="tag">Forfeited</span></li>';}).join('');
  var yr=ranked.findIndex(function(x){return you&&x.p.wallet===you.wallet;});
  var net=you?(youWon?potU-g.stake:-g.stake):0n;
  var mine=you?'<section class="panel"><h2>Your race</h2><div style="margin-top:12px"><div class="net-line"><span>Finished</span><b>'+(you.revealed?ord(yr+1)+' of '+g.revealedCount:'Forfeited')+'</b></div><div class="net-line"><span>Stake</span><span class="mono">−'+usd(g.stake)+' USDC</span></div><div class="net-line"><span>Prize</span><span class="mono">'+(youWon?'+'+potS:'0')+' USDC</span></div><div class="net-line"><span>Net</span><b class="mono '+(net>=0n?'up':'down')+'">'+(net>=0n?'+':'−')+usd(net<0n?-net:net)+' USDC</b></div></div></section>':'';
  return '<section class="winner"><span class="lab">Winner</span><div class="nmx"><i style="background:'+silksFor(ws.wallet,ws.name).c1+'">'+(g.players.indexOf(ws)+1)+'</i>'+esc(ws.name)+'</div><p>'+line+'</p></section>'+
    '<div class="grid-main"><section class="panel"><h2>Final scores</h2>'+(g.revealedCount>1?'<div class="legend" style="margin-top:12px"><span><i style="background:var(--roll)"></i>Roll from the secrets</span><span><i style="background:var(--gold)"></i>Name boost</span></div>':'')+'<ol class="scores" style="margin:12px 0 0;padding:0;list-style:none">'+scoreRows+'</ol>'+(forf?'<ul class="list forfs">'+forf+'</ul>':'')+'</section>'+
    '<div class="stack">'+mine+
    '<section class="panel"><h2>Share card</h2><p class="sub" style="margin-bottom:12px">The result everyone in the race sees.</p><pre class="share" id="shareTxt">'+esc(shareText(g,ranked))+'</pre><div class="actions" style="margin-top:0"><button type="button" class="btn alt" data-act="copyresult">Copy result</button><button type="button" class="btn alt" data-act="copylink">Copy link</button></div></section>'+
    '<section class="panel"><h2>How it was decided</h2><p class="sub" style="margin-bottom:12px">Anyone can recompute this from the contract.</p><p class="formula">score = roll(secrets + block hash) + boost(wallet, name)</p><p class="hash">'+(g.revealedCount>1?'Seed '+g.seed.slice(0,34)+'…<br>Seed block '+g.seedBlock:'No roll needed: fewer than two players revealed.')+'</p></section></div></div>'+
    '<div class="actions">'+(S.claimable>0n?'<button type="button" class="btn hot" data-act="claim"'+(S.busy?' disabled':'')+'>'+(S.busy||'Claim '+usd(S.claimable)+' USDC')+'</button>':'')+(g.revealedCount>=2?'<button type="button" class="btn alt" data-act="watch">Watch the race</button>':'')+'<a class="btn alt" href="#/">Back to the lobby</a></div>';
}
function shareText(g,ranked){
  var l=['StableRun · #'+g.id+' · '+g.playerCount+' horses · '+usd(g.stake*BigInt(g.playerCount))+' USDC pool',''];
  ranked.forEach(function(x,k){ var p=x.p; l.push(ord(k+1)+'  '+p.name+'  '+(g.revealedCount>1?(p.score/100).toFixed(2)+'  ('+(p.roll/100).toFixed(2)+' + '+(p.boost/100).toFixed(2)+')  ':'')+short(p.wallet)); });
  g.players.forEach(function(p){ if(!p.revealed) l.push('DNR  '+p.name+'  (forfeited)  '+short(p.wallet)); });
  l.push('','Seed '+g.seed.slice(0,18)+'…');
  return l.join('\n');
}
function cancelledHtml(g){
  return '<section class="panel" style="max-width:640px"><h2>Race #'+g.id+' was cancelled</h2><p class="sub">'+(g.playerCount?'Every stake was refunded.':'Nobody had joined.')+(S.claimable>0n?' Claim your USDC below.':'')+'</p><div class="actions">'+(S.claimable>0n?'<button type="button" class="btn hot" data-act="claim"'+(S.busy?' disabled':'')+'>'+(S.busy||'Claim '+usd(S.claimable)+' USDC')+'</button>':'')+'<a class="btn alt" href="#/">Back to the lobby</a></div></section>';
}

/* ----- clock-driven bits ----- */
function tick(){
  var g=S.game; if(!g) return;
  var now=chainNow();
  if(g.status===ST.OPEN){ var jl=$('#joinLeft'); if(jl) jl.textContent=now>g.joinDeadline?'now (anyone can cancel)':hms(g.joinDeadline-now); }
  if(g.status===ST.REVEALING){
    var cd=$('#cdown'); if(cd) cd.textContent=now>g.revealDeadline?'0:00 (closed)':mmss(g.revealDeadline-now);
    var sb=$('#startBtn'), sh=$('#startHint');
    if(sb){ var s=startState(g); sb.disabled=!s.can||!!S.busy; sb.textContent=S.busy||s.label; if(sh) sh.textContent=s.hint; }
    var rb=$('#revealBtn'); if(rb&&now>g.revealDeadline) rb.disabled=true;
  }
}

/* ====== actions ====== */
async function run(fn){ try{ await fn(); } catch(e){ toast(e&&e.message?e.message:String(e)); setBusy(''); } }
async function ensureFunds(needU){
  await refreshBalances();
  if(S.balance<needU) throw new Error('You need '+usd(needU)+' USDC. Your wallet has '+usd(S.balance)+'.');
  var al=BigInt(await ethCall(S.usdc,SEL.allowance+addrW(S.account)+addrW(S.cfg.contract),S.account));
  if(al<needU) await send(S.usdc,SEL.approve+addrW(S.cfg.contract)+W(MAXU),'Approve USDC');
}
async function commitFor(id,secret){
  var out=await ethCall(S.cfg.contract,SEL.commitHash+W(id)+addrW(S.account)+secret.slice(2));
  return out.slice(2);
}
async function doCreate(){
  var c=createCheck(); if(!c.ok) throw new Error(c.msg||'Check the form.');
  await ensureFunds(c.stakeU);
  var id=BigInt(await ethCall(S.cfg.contract,SEL.nextGameId)), secret=randomSecret(), commit=await commitFor(id,secret);
  saveSecret(String(id),secret);
  await send(S.cfg.contract,SEL.createAndJoin+W(id)+W(c.stakeU)+W(S.draft.n)+W(160)+commit+encStr(c.name),'Creating your race');
  toast('Race #'+id+' is open. Share the link with friends.');
  S.draft.name='';
  location.hash='#/game/'+id;
}
async function doJoin(){
  var g=S.game, c=joinCheck(); if(!c.ok) throw new Error(c.msg||'Check the name.');
  await ensureFunds(g.stake);
  var secret=randomSecret(), commit=await commitFor(g.id,secret);
  saveSecret(String(g.id),secret);
  await send(S.cfg.contract,SEL.join+W(g.id)+W(96)+commit+encStr(c.name),'Entering the race');
  await refreshAll(); S.sig=''; render();
}
async function doReveal(secret){
  var g=S.game;
  await send(S.cfg.contract,SEL.reveal+W(g.id)+secret.slice(2),'Revealing');
  await refreshAll(); S.sig=''; render();
}
async function doStart(){
  var g=S.game; await refreshClock();
  await send(S.cfg.contract,SEL.startRace+W(g.id),'Starting the race');
  await refreshAll(); S.sig='';
  if(S.game&&S.game.status===ST.FINAL&&S.game.revealedCount>=2) S.watching=true;
  render();
}
async function doClaim(){
  await send(S.cfg.contract,SEL.claim,'Claiming');
  toast('Claimed. USDC is on its way to your wallet.');
  await refreshAll(); S.sig=''; render();
}
async function doCancel(){
  await send(S.cfg.contract,SEL.cancel+W(S.game.id),'Cancelling');
  await refreshAll(); S.sig=''; render();
}
var ACT={
  'connect':function(el){ var picker=document.getElementById('walletPicker'); if(picker) picker.remove(); run(async function(){ var d=S.providers[+el.dataset.i]; if(await useProvider(d,true)) await afterConnect(); S.sig=''; render(); }); },
  'switch':function(){ run(async function(){ await switchChain(); if(S.provider&&S.account){ try{ S.chainId=parseInt(await rpc('eth_chainId',[]),16); await afterConnect(); }catch(e){ S.notice={kind:'switch'}; S.ready=false; render(); } } }); },
  'saveSetup':function(){
    var a=($('#setupContract').value||'').trim(), m=$('#setupMsg');
    if(!/^0x[0-9a-fA-F]{40}$/.test(a)){ m.textContent='That does not look like a contract address.'; m.className='msg bad'; return; }
    S.cfg={contract:a,chainId:+$('#setupNet').value}; saveCfg(); location.hash='#/'; location.reload();
  },
  'n-dec':function(){ S.draft.n=Math.max(2,S.draft.n-1); updateCreateForm(); },
  'n-inc':function(){ S.draft.n=Math.min(8,S.draft.n+1); updateCreateForm(); },
  'stake':function(el){ S.draft.stake=el.dataset.v; $('#stakeIn').value=el.dataset.v; updateCreateForm(); },
  'goPaddock':function(){ S.trialName=S.draft.name||'Midnight Runner'; location.hash='#/paddock'; },
  'backLobby':function(){ location.hash='#/'; },
  'create':function(){ var inp=$('#trialName'); if(inp) S.draft.name=norm(inp.value); run(doCreate); },
  'trialRandom':function(){ var inp=$('#trialName'); if(inp){ inp.value=pick(HORSES); S.trialName=inp.value; S.draft.name=inp.value; drawTrialPreview(performance.now()/180); var m=$('#paddockMsg');if(m){m.textContent='';m.className='msg';}var b=$('#confirmCreate');if(b)b.disabled=!!S.busy;var label=$('#trialHorseName');if(label)label.textContent=inp.value; inp.focus({preventScroll:true}); } },
  'join':function(){ run(doJoin); },
  'rand':function(){
    var used=S.game.players.map(function(p){return p.name.toLowerCase();}), nm;
    do{ nm=pick(HORSES); }while(used.indexOf(nm.toLowerCase())>=0);
    var inp=$('#horseName'); inp.value=nm; onJoinName(); inp.focus({preventScroll:true});
  },
  'reveal':function(){ var s=loadSecret(String(S.game.id)); if(!s){ toast('This browser does not have your secret.'); return; } run(function(){ return doReveal(s); }); },
  'restore':function(){
    var v=($('#restoreIn').value||'').trim();
    if(!/^0x[0-9a-fA-F]{64}$/.test(v)){ toast('A secret backup is 0x followed by 64 characters.'); return; }
    saveSecret(String(S.game.id),v); run(function(){ return doReveal(v); });
  },
  'start':function(){ run(doStart); },
  'claim':function(){ run(doClaim); },
  'cancel':function(){ run(doCancel); },
  'openGame':function(el){ location.hash='#/game/'+el.dataset.id; },
  'findGame':function(){ var v=($('#codeIn').value||'').replace(/\D/g,''); if(!v){ toast('Enter a race number.'); return; } location.hash='#/game/'+v; },
  'copylink':function(){ copyText(location.href.split('#')[0]+'#/game/'+S.game.id,'Link copied'); },
  'copysecret':function(){ var s=loadSecret(String(S.game.id)); if(!s){ toast('No secret saved in this browser.'); return; } copyText(s,'Secret backup copied. Keep it private until the reveal.'); },
  'copyresult':function(){ var el=$('#shareTxt'); if(el) copyText(el.textContent,'Result copied'); },
  'watch':function(){ if(S.race){ S.watching=true; S.sig=''; render(); } },
  'result':function(){ S.watching=false; S.sig=''; render(); },
  'skip':function(){ S.watching=false; S.sig=''; render(); }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  var f=ACT[el.dataset.act]; if(f) f(el);
});
$('#claimChip').addEventListener('click',function(){ run(doClaim); });
$('#wallet').addEventListener('click',async function(){
  if(S.account&&S.chainId&&S.chainId!==Number(S.cfg.chainId)){
    run(async function(){ await switchChain(); if(S.provider){ S.chainId=parseInt(await rpc('eth_chainId',[]),16); await afterConnect(); } });
    return;
  }
  if(S.account){ toast('Connected with '+(S.providerName||'your wallet')+'. Switch accounts in your wallet.'); return; }
  if(!S.providers.length) S.providers=await discoverProviders();
  showWalletPicker();
});
function showWalletPicker(){
  var old=document.getElementById('walletPicker'); if(old) old.remove();
  var names=S.providers.map(function(p){return p.info&&p.info.name?p.info.name:'Browser wallet';});
  var options=S.providers.length?S.providers.map(function(p,i){
    var name=p.info&&p.info.name?p.info.name:'Browser wallet';
    return '<button type="button" class="btn '+(i===0?'hot':'alt')+'" data-act="connect" data-i="'+i+'">'+esc(name)+'</button>';
  }).join(''):'<p class="msg bad">No injected wallet was detected. Install a browser wallet or open StableRun inside its app browser. WalletConnect is not configured in this version.</p>';
  var modal=document.createElement('div'); modal.id='walletPicker'; modal.className='wallet-picker'; modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.setAttribute('aria-labelledby','walletPickerTitle');
  modal.innerHTML='<section class="wallet-picker-card"><h2 id="walletPickerTitle">Choose your wallet</h2><p>Select a wallet detected in this browser. Your wallet will ask you to approve the connection.</p><div class="wallet-options">'+options+'</div><button type="button" class="btn alt wallet-picker-close" data-wallet-close>Cancel</button></section>';
  modal.addEventListener('click',function(e){if(e.target===modal||e.target.closest('[data-wallet-close]')) modal.remove();});
  document.addEventListener('keydown',function escPicker(e){if(e.key==='Escape'){modal.remove();document.removeEventListener('keydown',escPicker);}});
  document.body.appendChild(modal);
}
document.addEventListener('input',function(e){
  var id=e.target&&e.target.id;
  if(id==='horseName') onJoinName();
  if(id==='trialName'){ S.trialName=e.target.value; if(S.route.name==='paddock') S.draft.name=e.target.value; drawTrialPreview(performance.now()/180); }
  if(id==='stakeIn'){ S.draft.stake=e.target.value; updateCreateForm(); }
  if(id==='createName'){ S.draft.name=e.target.value; updateCreateForm(); }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  var id=e.target&&e.target.id;
  if(id==='horseName'){ e.preventDefault(); var b=$('#joinBtn'); if(b&&!b.disabled) run(doJoin); }
  if(id==='createName'||id==='stakeIn'){ e.preventDefault(); var c=$('#createBtn'); if(c&&!c.disabled) run(doCreate); }
  if(id==='codeIn'){ e.preventDefault(); ACT.findGame(); }
});

/* ====== routing and boot ====== */
function parseRoute(){
  var h=location.hash||'', m=h.match(/^#\/game\/(\d+)$/);
  if(m) return {name:'game',id:parseInt(m[1],10)};
  if(h==='#/setup') return {name:'setup'};
  if(h==='#/paddock') return {name:'paddock'};
  return {name:'lobby'};
}
async function onRoute(){
  S.route=parseRoute(); S.game=null; S.watching=false; S.sig=''; S.loaded=false; S.recent=null;
  render();
  if(S.ready){ try{ await refreshAll(); }catch(e){} S.loaded=true; S.sig=''; render(); }
}
async function boot(){
  S.cfg=loadCfg(); S.route=parseRoute();
  window.addEventListener('hashchange',onRoute);
  render();
  if(S.cfg.contract){
    S.providers=await discoverProviders();
    var saved=null; try{ saved=localStorage.getItem('stablerun:wallet'); }catch(e){}
    var d=S.providers.filter(function(p){return p.info.uuid===saved;})[0]||(S.providers.length===1?S.providers[0]:null);
    if(d){ try{ if(await useProvider(d,false)) await afterConnect(); }catch(e){} }
  }
  S.booted=true; S.loaded=true; S.sig=''; render();
}
boot();

})();
</script>
