<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>StableRun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one racecard column. The loud moments are the hero banner and the race stage; every other panel stays quiet and print-like. */
:root{
  --bg:#EAF0EA; --surface:#F6F9F5; --ink:#0E2A1C; --muted:#4C6556; --line:#C7D5C9;
  --turf:#3E8E58; --turf2:#47A062; --rail:#FFFFFF;
  --accent:#D13A26; --accent-ink:#FFFFFF;
  --gold:#E0A800; --gold-text:#7D5E00; --roll:#3E8E58;
  --tote-bg:#0F2318; --tote-fg:#F5D36B;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1510; --surface:#11231A; --ink:#E6F0E8; --muted:#9BB4A3; --line:#25402F;
    --turf:#1E5A38; --turf2:#256843; --rail:#D5E2D8;
    --accent:#FF7A5E; --accent-ink:#1A0D08;
    --gold:#F2C230; --gold-text:#F2C230; --roll:#4DAA6D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1510; --surface:#11231A; --ink:#E6F0E8; --muted:#9BB4A3; --line:#25402F;
  --turf:#1E5A38; --turf2:#256843; --rail:#D5E2D8;
  --accent:#FF7A5E; --accent-ink:#1A0D08;
  --gold:#F2C230; --gold-text:#F2C230; --roll:#4DAA6D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.app{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font:900 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.net{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:4px;align-self:flex-end;padding-bottom:3px}
.wallet{display:inline-flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;font:500 13px var(--f-mono)}
.wallet:hover{border-color:var(--ink)}
.wallet .bal{color:var(--gold-text)}

/* step rail */
.rail{list-style:none;margin:0 0 28px;padding:10px 0 0;display:flex;gap:6px;overflow-x:auto;border-top:1px solid var(--line)}
.rail li{display:flex;align-items:center;gap:8px;padding:6px 0;font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rail li+li::before{content:"";width:18px;height:1px;background:var(--line);margin-right:6px}
.rail .n{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;font:500 11px var(--f-mono)}
.rail li.done{color:var(--ink)}
.rail li.done .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail li.now{color:var(--ink)}
.rail li.now .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* type */
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:uppercase;text-wrap:balance}
.hero h1{font-weight:900;font-size:clamp(54px,12vw,120px);line-height:.86;letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{max-width:60ch;color:var(--muted);font-size:17px;margin:18px 0 0}
h2{font-weight:900;font-size:24px;letter-spacing:.02em;line-height:1.05}
.sub{color:var(--muted);margin:6px 0 16px;max-width:60ch}
.lab{display:block;font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
small{color:var(--muted)}

/* hero banner */
.hero{margin-bottom:28px}
.banner{margin-top:26px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.banner canvas,.stagewrap canvas{display:block;width:100%}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;min-width:0}
.grid2,.grid-main{display:grid;gap:20px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.grid-main{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:820px){.grid2,.grid-main{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:20px;min-width:0}

/* buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:4px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.12)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--ink);filter:none}
.btn.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.linkbtn:hover{color:var(--ink)}
input[type=text]{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px 14px;font:500 17px var(--f-body);min-height:46px}
input[type=text]:focus{border-color:var(--ink);outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.stepper button{width:46px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink)}
.stepper button:hover{background:var(--line)}
.stepper output{display:grid;place-items:center;min-width:56px;font:500 22px var(--f-mono)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;font:500 14px var(--f-mono);min-height:42px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{margin-top:18px}
.sum{margin:18px 0 0;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted)}
.sum b{color:var(--ink)}
.msg{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.msg.bad{color:var(--accent)}

/* open races */
.list{list-style:none;margin:0;padding:0}
.open{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.open:first-child{border-top:0;padding-top:0}
.open>div{flex:1;min-width:0;display:grid}
.dots{display:flex;gap:4px}
.dots .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dots .d.on{background:var(--ink);border-color:var(--ink)}
.codeform{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}

/* how it works */
.how{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-top:1px solid var(--line);padding-top:18px;list-style:none;padding-left:0;margin-bottom:0}
.how li{display:grid;gap:4px;align-content:start}
.how b{font:900 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.how span{color:var(--muted);font-size:14px}
.how .k{font:500 12px var(--f-mono);color:var(--accent)}
@media (max-width:700px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* paddock */
.preview{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center;margin-top:12px}
@media (max-width:560px){.preview{grid-template-columns:minmax(0,1fr)}}
.preview canvas{display:block;width:100%;max-width:260px;border:1px solid var(--line);border-radius:4px}
.boostbox .big{font:900 64px/1 var(--f-display);letter-spacing:.01em}
.meter{position:relative;height:10px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold);transition:width .25s}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--surface) calc(25% - 1px) 25%)}
.scale{display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--muted);margin-top:4px}
.tried{margin-top:18px}
.tried .chips{gap:6px}
.tchip{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:14px}
.tchip:hover{border-color:var(--ink)}
.tchip.best{border-color:var(--gold)}
.tchip .mono{color:var(--gold-text);font-size:12px}

/* seats / racecard */
.seats{list-style:none;margin:0;padding:0}
.seat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.seat:first-child{border-top:0}
.seat .no{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:3px;color:#fff;font:900 18px var(--f-display);background:var(--muted)}
.seat .who{flex:1;min-width:0;display:grid;line-height:1.3}
.seat .who b{overflow-wrap:anywhere}
.seat .who small{font-size:12.5px;overflow-wrap:anywhere}
.seat .boost{font:500 13px var(--f-mono);color:var(--gold-text)}
.seat.empty .no{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.seat.empty{color:var(--muted)}
.seat.you .who b::after{content:" · you";font-weight:400;color:var(--muted)}
.tag{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:3px 7px;color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 4px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.codebox{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px dashed var(--muted);border-radius:4px;padding:10px 12px;margin:14px 0}
.codebox b{font:500 20px var(--f-mono);letter-spacing:.06em}
.note{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.proto{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.bigact{display:grid;gap:10px;justify-items:start}
.hash{font:400 12px/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}

/* race stage */
.stagehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.stagehead .mono{font-size:12.5px;color:var(--muted)}
.stagewrap{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.tote{background:var(--tote-bg);color:var(--tote-fg);font:500 14px/1.45 var(--f-mono);padding:12px 14px;display:grid;gap:2px;min-height:82px;align-content:start}
.tote .l0{font-size:16px}
.tote .l1,.tote .l2{opacity:.5}
.board{position:relative;margin-top:16px;border-top:1px solid var(--line)}
.brow{position:absolute;left:0;right:0;height:44px;display:grid;grid-template-columns:34px 28px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:0 4px;border-bottom:1px solid var(--line);transition:transform .4s cubic-bezier(.3,.7,.2,1)}
.brow .pos{font:900 20px var(--f-display);text-align:right}
.brow .no{display:grid;place-items:center;width:26px;height:26px;border-radius:3px;color:#fff;font:900 16px var(--f-display)}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.brow .gap{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.brow .bst{font:500 12.5px var(--f-mono);color:var(--gold-text)}
@media (max-width:520px){.brow .bst{display:none}.brow{grid-template-columns:30px 26px minmax(0,1fr) auto}}
.after{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}

/* result */
.winner{display:grid;gap:6px;margin-bottom:24px}
.winner .nmx{font:900 clamp(48px,11vw,104px)/.88 var(--f-display);text-transform:uppercase;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.winner .nmx i{display:grid;place-items:center;width:.72em;height:.72em;font-style:normal;color:#fff;border-radius:4px;font-size:.8em}
.winner p{margin:8px 0 0;font-size:18px;max-width:60ch}
.winner .lab{color:var(--accent);margin:0}
.scores{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.scores li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.scores .no{display:grid;place-items:center;width:30px;height:30px;border-radius:3px;color:#fff;font:900 18px var(--f-display)}
.scores .nm{font-weight:700;overflow-wrap:anywhere}
.scores .nm small{font-weight:400;margin-left:6px}
.scores .tot{font:500 16px var(--f-mono)}
.scores .bar{grid-column:2 / 4;height:12px;display:flex;background:var(--line);border-radius:2px;overflow:hidden}
.scores .bar i{display:block;height:100%}
.scores .bar .r{background:var(--roll)}
.scores .bar .b{background:var(--gold)}
.scores .split{grid-column:2 / 4;font:400 12px var(--f-mono);color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
pre.share{margin:0 0 12px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:4px;font:400 12.5px/1.55 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.formula{font:500 14px var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0 0 12px;overflow-x:auto}
.net-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.net-line:first-of-type{border-top:0}
.up{color:var(--roll);font-weight:700}
.down{color:var(--accent);font-weight:700}

.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;max-width:78ch}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 27V14a9 9 0 0 1 18 0v13h-5.5V14a3.5 3.5 0 0 0-7 0v13z" fill="currentColor"/><circle cx="9.7" cy="21" r="1.1" fill="var(--bg)"/><circle cx="9.7" cy="16.5" r="1.1" fill="var(--bg)"/><circle cx="22.3" cy="21" r="1.1" fill="var(--bg)"/><circle cx="22.3" cy="16.5" r="1.1" fill="var(--bg)"/></svg>
      <span>StableRun</span><span class="net">Base Sepolia · prototype</span>
    </div>
    <button class="wallet" id="wallet" data-act="switch" type="button" title="Switch to a different demo wallet"></button>
  </header>
  <ol class="rail" id="rail" aria-label="Race progress"></ol>
  <main id="main"></main>
  <footer class="foot">Prototype with mock USDC and simulated friends. Nothing here touches a chain. The name boost uses a simple browser hash for now; the contract will derive it from the wallet address and horse name, and take the secrets for the race roll.</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

// <pure>
function h32(str, seed){
  var h=(2166136261 ^ seed)>>>0;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  h^=h>>>15; h=Math.imul(h,2246822507)>>>0; h^=h>>>13; h=Math.imul(h,3266489909)>>>0; h^=h>>>16;
  return h>>>0;
}
function hex64(str){ var s=''; for(var i=0;i<8;i++){ s+=h32(str,1000+i*7919).toString(16).padStart(8,'0'); } return '0x'+s; }
function norm(name){ return String(name).trim().replace(/\s+/g,' '); }
function nameBoost(addr,name){
  // average of three independent draws, so mid-range boosts are common and high ones are rare
  var k=addr.toLowerCase()+'|'+norm(name).toLowerCase(), t=0;
  for(var i=0;i<3;i++) t+=h32(k,77+i*131)%1201;
  return Math.round(t/3)/100;
}
var COATS=['#6a3d20','#8b5a2b','#2a211d','#a8743d','#7b7b7b','#c9b58c','#4a2e1c','#8d6b4f'];
function silksFor(addr,name){
  var h=h32(addr.toLowerCase()+'|'+norm(name).toLowerCase(),5);
  var hue=h%360, hue2=(hue+140+((h>>>9)%80))%360;
  return {c1:'hsl('+hue+' 72% 44%)', c2:'hsl('+hue2+' 85% 78%)', pattern:(h>>>16)%3, coat:COATS[(h>>>20)%COATS.length]};
}
function computeRace(entries){
  var seed=hex64(entries.map(function(e){return e.secret;}).join('|'));
  var rows=entries.map(function(e,i){
    var roll=(h32(seed+'|'+e.addr.toLowerCase(),11)%10000)/100;
    return {idx:i, roll:roll, boost:e.boost, score:Math.round((roll+e.boost)*100)/100};
  });
  var maxScore=Math.max.apply(null,rows.map(function(r){return r.score;}));
  rows.forEach(function(r){
    r.T=16+(maxScore-r.score)*0.06;
    var h=h32(seed+'|'+entries[r.idx].addr.toLowerCase(),21);
    r.k1=1+(h%4); r.k2=1+((h>>>3)%5); if(r.k2===r.k1) r.k2=(r.k2%5)+1;

    r.A2=((h>>>13)%71)/100-0.35;
  });

  order.forEach(function(r,i){r.rank=i+1;});
  return {seed:seed, rows:rows, order:order};
}
function progress(r,tau){
  var u=Math.min(1,Math.max(0,tau/r.T));
  return u+r.A1/(r.k1*Math.PI)*Math.sin(r.k1*Math.PI*u)+r.A2/(r.k2*Math.PI)*Math.sin(r.k2*Math.PI*u);
}
function speedAt(r,tau){
  var u=Math.min(1,Math.max(0,tau/r.T));
  return (1+r.A1*Math.cos(r.k1*Math.PI*u)+r.A2*Math.cos(r.k2*Math.PI*u))/r.T;
}
function marginText(w,l){
  var len=(l.T-w.T)/l.T*12.86;
  if(len<0.1) return 'a nose';
  if(len<0.2) return 'a short head';
  if(len<0.35) return 'a head';
  if(len<0.7) return 'a neck';
  if(len<1.2) return 'a length';
  var q=Math.round(len*4)/4, whole=Math.floor(q), fr=q-whole;
  var f=fr===0.25?'¼':fr===0.5?'½':fr===0.75?'¾':'';
  return whole+f+' lengths';
}
function ord(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function boostWord(b){ return b<3.5?'Plodder':b<5.2?'Steady':b<6.8?'Handy':b<8.5?'Quick':b<10?'Flyer':'Once in a generation'; }

function randHex(n){
  var b=new Uint8Array(n);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(b); else for(var i=0;i<n;i++) b[i]=Math.random()*256|0;
  return Array.prototype.map.call(b,function(x){return x.toString(16).padStart(2,'0');}).join('');
}

/* ---------- timers and loops ---------- */
function later(fn,ms){ var id=setTimeout(fn,ms); S.timers.push(id); return id; }
function clearTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }
var rafId=0;
function stopLoop(){ cancelAnimationFrame(rafId); rafId=0; }
function startLoop(fn){
  stopLoop();
  var last=performance.now();
  var f=function(ts){ var dt=Math.min(0.05,Math.max(0,(ts-last)/1000)); last=ts; fn(dt); rafId=requestAnimationFrame(f); };
  rafId=requestAnimationFrame(f);
}
var toastT=0;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2800); }
function copyText(t,ok){
  var fail=function(){toast('Copy was blocked here. Select the text and copy it.');};
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast(ok||'Copied');},fail); } else fail();
}
function fakeTx(btn,labels,done){
  btn.disabled=true; var orig=btn.textContent; btn.textContent=labels[0];
  later(function(){ btn.textContent=labels[1]; later(function(){ btn.textContent=orig; done(); },1000); },900);
}

/* ---------- game model ---------- */
function makeSeat(o){
  var secret=randHex(32);
  return {addr:o.addr,owner:o.owner,name:norm(o.name),boost:nameBoost(o.addr,o.name),silks:silksFor(o.addr,o.name),secret:secret,commit:hex64('commit|'+secret+'|'+o.addr),revealed:false,you:!!o.you};
}
function addBot(G){
  var used=G.seats.map(function(s){return s.name.toLowerCase();}), usedO=G.seats.map(function(s){return s.owner;});
  var name,owner;
  do{name=pick(HORSES);}while(used.indexOf(name.toLowerCase())>=0);
  do{owner=pick(FRIENDS);}while(usedO.indexOf(owner)>=0);
  G.seats.push(makeSeat({addr:newAddr(),owner:owner,name:name}));
}
function newGame(o){
  var G={code:o.code,n:o.n,stake:o.stake,host:o.host,seats:[],you:null};
  for(var i=0;i<o.taken;i++) addBot(G);
  if(o.taken>0&&o.host!=='You') G.seats[0].owner=o.host;
  return G;
}
function genCode(){ var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='RUN-'; for(var i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }

/* ---------- drawing ---------- */
function darken(hex,f){ var n=parseInt(hex.slice(1),16); var c=function(v){return Math.round(v*f);}; return 'rgb('+c((n>>16)&255)+','+c((n>>8)&255)+','+c(n&255)+')'; }
function themeColors(){
  var cs=getComputedStyle(document.documentElement), g=function(k){return cs.getPropertyValue(k).trim();};
  return {surface:g('--surface'),turf:g('--turf'),turf2:g('--turf2'),rail:g('--rail'),muted:g('--muted'),accent:g('--accent'),gold:g('--gold'),ink:g('--ink')};
}
// Horse faces right. cx = body centre, gy = ground. Nose sits 38 units ahead of cx, tail 33 behind.
function drawHorse(ctx,cx,gy,s,ph,m,sk,num){
  ctx.save();
  ctx.translate(cx,gy-m*Math.abs(Math.sin(ph))*1.8*s);
  ctx.scale(s,s);
  ctx.lineCap='round'; ctx.lineJoin='round';
  var coat=sk.coat, dk=darken(coat,0.62), mane='#1b130e';
  function leg(ax,off,col){
    var ay=-17, p=ph+off, tu=m*0.65*Math.sin(p), tl=tu-m*(0.55+0.55*Math.sin(p-0.9));
    var kx=ax+Math.sin(tu)*9, ky=ay+Math.cos(tu)*9, hx=kx+Math.sin(tl)*9, hy=ky+Math.cos(tl)*9;
    ctx.strokeStyle=col; ctx.lineWidth=3.4; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(kx,ky); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.fillStyle=mane; ctx.beginPath(); ctx.arc(hx,hy,1.9,0,7); ctx.fill();
  }
  leg(13,3.0,dk); leg(-13,0,dk);
  ctx.strokeStyle=mane; ctx.lineWidth=3.4; ctx.beginPath(); ctx.moveTo(-18,-27);
  ctx.quadraticCurveTo(-27,-28+Math.sin(ph*2)*2*m,-33,-20+Math.sin(ph*2+1)*3*m); ctx.stroke();
  ctx.fillStyle=coat; ctx.beginPath(); ctx.ellipse(0,-23,20,9.5,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10,-28); ctx.lineTo(24,-44); ctx.lineTo(29,-40); ctx.lineTo(17,-19); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(30,-40); ctx.rotate(0.75); ctx.beginPath(); ctx.ellipse(3,0,8,3.8,0,0,7); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.moveTo(24,-44); ctx.lineTo(25,-49); ctx.lineTo(27.5,-44); ctx.fill();
  ctx.strokeStyle=mane; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(11,-31); ctx.lineTo(24,-45); ctx.stroke();
  ctx.fillStyle=mane; ctx.beginPath(); ctx.arc(31.5,-40.5,1,0,7); ctx.fill();
  leg(10,3.5,coat); leg(-16,0.4,coat);
  // saddlecloth
  ctx.fillStyle=sk.c1; ctx.fillRect(-5,-33,12,8);
  if(num){ ctx.fillStyle='#fff'; ctx.font='900 8.5px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(num),1,-28.8); }
  // jockey
  ctx.save(); ctx.translate(5.5,-37); ctx.rotate(-0.43);
  ctx.beginPath(); ctx.ellipse(0,0,7.5,3.8,0,0,7); ctx.save(); ctx.clip();
  ctx.fillStyle=sk.c1; ctx.fillRect(-9,-5,18,10);
  ctx.fillStyle=sk.c2;
  if(sk.pattern===1){ [-4.5,0,4.5].forEach(function(x){ctx.fillRect(x-1.2,-5,2.4,10);}); }
  else if(sk.pattern===2){ ctx.fillRect(0,-5,10,10); }
  ctx.restore(); ctx.restore();
  ctx.strokeStyle=sk.c1; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(11,-39); ctx.lineTo(19,-36); ctx.stroke();
  ctx.strokeStyle='#efe8dc'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(3,-33.5); ctx.lineTo(8,-27.5); ctx.stroke();
  ctx.fillStyle='#e9bf9d'; ctx.beginPath(); ctx.arc(14,-41.5,3.1,0,7); ctx.fill();
  ctx.fillStyle=sk.c2; ctx.beginPath(); ctx.arc(14,-41.8,3.4,Math.PI*0.95,Math.PI*2.05); ctx.fill();
  ctx.restore();
}
function paintTurf(ctx,W,y0,y1,C,off){
  ctx.fillStyle=C.turf; ctx.fillRect(0,y0,W,y1-y0);
  ctx.fillStyle=C.turf2;
  for(var x=-46+((off||0)%92),k=0;x<W;x+=46,k++){ if(k%2) ctx.fillRect(x,y0,46,y1-y0); }
}
function paintRails(ctx,W,y0,y1,C){
  ctx.fillStyle=C.rail; ctx.fillRect(0,y0-5,W,5); ctx.fillRect(0,y1,W,5);
  for(var x=10;x<W;x+=48){ ctx.fillRect(x,y0-12,3,12); ctx.fillRect(x,y1+5,3,10); }
}

/* hero banner: ambient horses running laps */
function heroInit(){
  var cv=$('#heroCv'); if(!cv) return;
  var ctx=cv.getContext('2d'), wrap=cv.parentElement, dpr=Math.min(2,window.devicePixelRatio||1);
  var H=124, W=0, s=0.95, C=themeColors(), fr=0;
  var A1='0x1111111111111111111111111111111111111111';
  var hs=[['Gas Fee',0,0.15,150],['Lunchbreak',0,0.62,118],['Hot Take',1,0.35,134],['Pennywise',1,0.85,104]].map(function(d,i){
    return {sk:silksFor(A1,d[0]),lane:d[1],x:d[2],v:d[3],ph:i*1.7,num:i+1};
  });
  function size(){ W=Math.max(300,wrap.clientWidth); cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); hs.forEach(function(h){ if(h.x<=1) h.x=h.x*W; }); }
  size();
  function draw(dt){
    if(wrap.clientWidth!==W&&wrap.clientWidth>0) size();
    fr++; if(fr%90===0) C=themeColors();
    ctx.fillStyle=C.surface; ctx.fillRect(0,0,W,H);
    paintTurf(ctx,W,16,H-8,C,0); paintRails(ctx,W,16,H-8,C);
    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.setLineDash([8,10]); ctx.beginPath(); ctx.moveTo(0,62); ctx.lineTo(W,62); ctx.stroke(); ctx.setLineDash([]);
    hs.forEach(function(h){
      if(!RM){ h.x+=h.v*dt; h.ph+=dt*(3+8*h.v/130); if(h.x-70*s>W+10){ h.x=-40-rnd(0,120); } }
      var gy=h.lane===0?52:108-6;
      drawHorse(ctx,h.x,gy,s,h.ph,RM?0.5:1,h.sk,h.num);
    });
  }
  draw(0.016);
  if(!RM) startLoop(draw);
}

  if(S.game.seats.some(function(s){return s.name.toLowerCase()===v.toLowerCase();})) return 'Another horse in this race already has that name.';
  return '';
}

VIEWFN.race=function(){

    rows+='<div class="brow" id="br'+i+'" style="transform:translateY('+(i*44)+'px)"><span class="pos mono">–</span><span class="no" style="background:'+s.silks.c1+'">'+(i+1)+'</span><span class="nm">'+esc(s.name)+'</span><span class="bst"></span><span class="gap mono"></span></div>';
  }

    '<div class="stagewrap"><canvas id="track" aria-label="Animated horse race"></canvas><div class="tote" id="tote" aria-live="polite"><span class="l0">Horses are loading into the stalls.</span></div></div>'+
    '<div class="board" id="board" style="height:'+(n*44)+'px">'+rows+'</div>'+
    '<div class="after"><button type="button" class="btn hot" data-act="result" id="afterBtn" hidden>See the result</button><button type="button" class="linkbtn" data-act="skip">Skip to result</button></div>';
};
function geo(W,n){
  var narrow=W<520, laneH=narrow?42:52, top=narrow?30:34, left=narrow?64:92, right=narrow?54:100;
  return {W:W,n:n,narrow:narrow,laneH:laneH,top:top,left:left,finishX:W-right,s:laneH/54,H:top+n*laneH+22};
}
INIT.race=function(){
  var R=S.race, G=S.game, n=G.seats.length, rows=R.rows;
  var cv=$('#track'), wrap=cv.parentElement, ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1), g;
  function setup(){ var W=Math.max(300,Math.floor(wrap.clientWidth)); g=geo(W,n); cv.width=Math.round(W*dpr); cv.height=Math.round(g.H*dpr); cv.style.height=g.H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  setup();
  var C=themeColors(), fr=0, tote=$('#tote'), lastBoard=0;
  var winnerT=R.order[0].T, close=n>1&&(R.order[1].T-R.order[0].T)<0.35;
  var st={tau:-3,msgs:[],lastMsg:-9,prevRank:null,prevIdx:null,fin:rows.map(function(){return false;}),nFin:0,ph:rows.map(function(){return 0;}),dust:[],conf:[],flash:0,half:false,last:false,slow:false};
  var nm=function(i){return G.seats[i].name;};
  function say(t){ st.msgs.unshift(t); st.msgs=st.msgs.slice(0,3); st.lastMsg=st.tau; tote.innerHTML=st.msgs.map(function(m,k){return '<span class="l'+k+'">'+esc(m)+'</span>';}).join(''); }
  function laneGround(i){ return g.top+i*g.laneH+g.laneH-5; }

  startLoop(function(dt){
    fr++; if(fr%90===0) C=themeColors();
    if(wrap.clientWidth>0&&Math.floor(wrap.clientWidth)!==g.W) setup();
    var scale=1;
    if(!RM&&close&&st.tau>0){ var lead0=0; rows.forEach(function(r){lead0=Math.max(lead0,progress(r,st.tau));}); if(lead0>0.9&&st.tau<winnerT+0.9) scale=0.5; }
    st.slow=scale<1;
    var prevTau=st.tau; st.tau+=dt*scale; var tau=st.tau;
    if(prevTau<0&&tau>=0) say("They're off!");

    var P=[],V=[],B=[];
    rows.forEach(function(r,i){
      var done=tau>=r.T;
      P[i]=tau<0?0:progress(r,tau);
      V[i]=tau<0?0:done?Math.exp(-(tau-r.T)*1.6):speedAt(r,tau)*16;
      B[i]=done?38*(1-Math.exp(-(tau-r.T)*2.4)):0;
      if(V[i]>0.02) st.ph[i]+=dt*scale*(3+8*V[i]);
    });

    // ranking
    var keys=rows.map(function(r,i){return tau>=r.T?2-r.T/100:P[i];});
    var idxs=rows.map(function(_,i){return i;}).sort(function(a,b){return keys[b]-keys[a];});
    var rank=[]; idxs.forEach(function(ix,k){rank[ix]=k;});

    // commentary
    var leadP=P[idxs[0]];
    if(st.nFin===0&&tau>1&&tau-st.lastMsg>1.8){
      if(!st.half&&leadP>=0.5){ st.half=true; say('Halfway. '+nm(idxs[0])+' leads.'); }
      else if(!st.last&&leadP>=0.83){ st.last=true; say('Into the final furlong. '+nm(idxs[0])+' in front.'); }
      else if(st.prevRank){
        if(idxs[0]!==st.prevIdx[0]) say(nm(idxs[0])+' goes to the front');
        else { for(var k=1;k<Math.min(3,n);k++){ var h=idxs[k]; if(st.prevRank[h]>k){ say(nm(h)+' moves up to '+ord(k+1)); break; } } }
      }
    }
    st.prevRank=rank; st.prevIdx=idxs;

    // finishes
    rows.forEach(function(r,i){
      if(!st.fin[i]&&tau>=r.T){
        st.fin[i]=true; st.nFin++;
        if(r.rank===1){
          say(n>1?nm(i)+' wins by '+marginText(r,R.order[1])+'!':nm(i)+' wins!'); st.flash=1;
          if(!RM){ var cnt=G.seats[i].you?130:70; for(var c=0;c<cnt;c++){ st.conf.push({x:g.finishX+rnd(-40,40),y:g.top-10,vx:rnd(-160,160),vy:rnd(-260,-40),rot:rnd(0,6),vr:rnd(-8,8),col:c%2?G.seats[i].silks.c1:G.seats[i].silks.c2,life:rnd(2,3.6)}); } }
        } else if(r.rank<=3){ say(nm(i)+' takes '+ord(r.rank)); }
      }
    });
    if(tau>=winnerT+1.2){ var ab=$('#afterBtn'); if(ab&&ab.hidden) ab.hidden=false; }

    // draw track
    var W=g.W, y0=g.top-6, y1=g.top+n*g.laneH+4;
    ctx.fillStyle=C.surface; ctx.fillRect(0,0,W,g.H);
    paintTurf(ctx,W,y0,y1,C,0); paintRails(ctx,W,y0,y1,C);
    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1; ctx.setLineDash([8,10]);
    for(var l=1;l<n;l++){ ctx.beginPath(); ctx.moveTo(0,g.top+l*g.laneH); ctx.lineTo(W,g.top+l*g.laneH); ctx.stroke(); }
    ctx.setLineDash([]);
    // furlong poles
    ctx.font='500 10px "JetBrains Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    for(var f=5;f>=1;f--){ var fx=g.left+(g.finishX-g.left)*((6-f)/6); ctx.fillStyle=C.rail; ctx.fillRect(fx-1,y0-12,2,12); ctx.fillStyle=C.muted; ctx.fillText(f+'f',fx,y0-16); }
    // stalls
    var open=tau<0?0:Math.min(1,tau/0.6);
    ctx.strokeStyle='#323b36'; ctx.lineWidth=3;
    for(var q=0;q<=n;q++){ var qy=g.top+q*g.laneH; ctx.beginPath(); ctx.moveTo(g.left-52,qy); ctx.lineTo(g.left-9,qy); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(g.left-9,y0+6); ctx.lineTo(g.left-9,y1-2); ctx.stroke();
    if(open<1){ ctx.globalAlpha=1-open; ctx.strokeStyle='#e8eee9'; ctx.lineWidth=2; for(var d=0;d<n;d++){ var dy=g.top+d*g.laneH; ctx.beginPath(); ctx.moveTo(g.left-7,dy+8); ctx.lineTo(g.left-7,dy+g.laneH-3); ctx.stroke(); } ctx.globalAlpha=1; }
    // lane plates
    if(!g.narrow){ for(var pl=0;pl<n;pl++){ var py=g.top+pl*g.laneH+(g.laneH-18)/2; ctx.fillStyle=G.seats[pl].silks.c1; ctx.fillRect(6,py,18,18); ctx.fillStyle='#fff'; ctx.font='900 14px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(pl+1),15,py+9.5); } }
    // finish line
    for(var cy=y0,ci=0;cy<y1;cy+=8,ci++){ ctx.fillStyle=ci%2?'#111':'#fff'; ctx.fillRect(g.finishX,cy,4,Math.min(8,y1-cy)); ctx.fillStyle=ci%2?'#fff':'#111'; ctx.fillRect(g.finishX+4,cy,4,Math.min(8,y1-cy)); }
    ctx.fillStyle=C.accent; ctx.font='900 12px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText('FINISH',g.finishX+4,y0-16);
    if(st.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(st.flash*0.35)+')'; ctx.fillRect(g.finishX-30,y0,60,y1-y0); st.flash=Math.max(0,st.flash-dt*1.4); }

    // horses (back lane first)
    for(var i2=0;i2<n;i2++){
      var nose=g.left+(g.finishX-g.left)*P[i2]+B[i2], cx=nose-38*g.s, gy=laneGround(i2);
      var m=Math.min(1,V[i2]*1.1);
      drawHorse(ctx,cx,gy,g.s,st.ph[i2],m,G.seats[i2].silks,i2+1);
      var tail=cx-33*g.s-5;
      if(tau>0.3){
        ctx.font='700 '+(g.narrow?10:11)+'px "Hanken Grotesk",sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
        var tw=ctx.measureText(G.seats[i2].name).width;
        if(tail-tw>4&&!st.fin[i2]){ ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.strokeText(G.seats[i2].name,tail,gy-16*g.s); ctx.fillStyle='#fff'; ctx.fillText(G.seats[i2].name,tail,gy-16*g.s); }
      }
      if(st.fin[i2]){
        var rk=rows[i2].rank, label=ord(rk); ctx.font='900 13px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        var bw=ctx.measureText(label).width+12, bx=Math.min(W-bw/2-4,g.finishX+bw/2+14), by=gy-g.laneH*0.55;
        ctx.fillStyle=rk===1?C.gold:'rgba(10,20,14,.78)'; ctx.fillRect(bx-bw/2,by-9,bw,18); ctx.fillStyle=rk===1?'#1a1200':'#fff'; ctx.fillText(label,bx,by+0.5);
      }
      if(!RM&&V[i2]>0.35&&Math.random()<0.45&&st.dust.length<220) st.dust.push({x:cx-30*g.s,y:gy-2,vx:-rnd(30,80),vy:-rnd(5,30),life:0.5,max:0.5,r:rnd(1.5,3.2)});
    }
    // dust
    for(var di=st.dust.length-1;di>=0;di--){ var p=st.dust[di]; p.life-=dt; if(p.life<=0){ st.dust.splice(di,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; ctx.fillStyle='rgba(222,206,170,'+(p.life/p.max*0.45)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    // confetti
    for(var ci2=st.conf.length-1;ci2>=0;ci2--){ var c2=st.conf[ci2]; c2.life-=dt; c2.vy+=420*dt; c2.x+=c2.vx*dt; c2.y+=c2.vy*dt; c2.rot+=c2.vr*dt; if(c2.life<=0||c2.y>g.H+10){ st.conf.splice(ci2,1); continue; } ctx.save(); ctx.translate(c2.x,c2.y); ctx.rotate(c2.rot); ctx.fillStyle=c2.col; ctx.fillRect(-3,-1.5,6,3); ctx.restore(); }
    // overlays
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(tau<0||tau<0.9){
      var txt=tau<0?(Math.ceil(-tau)<=3?String(Math.ceil(-tau)):''):'GO!';
      if(txt){ var fracT=tau<0?(-tau)%1:tau/0.9, sc=1+0.25*(tau<0?(1-fracT):0); ctx.save(); ctx.translate(W/2,g.H/2); ctx.scale(sc,sc); ctx.font='900 '+(g.narrow?72:96)+'px "Big Shoulders Display",Impact,sans-serif'; ctx.lineWidth=7; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.strokeText(txt,0,0); ctx.fillStyle='#fff'; ctx.fillText(txt,0,0); ctx.restore(); }
    }
    if(st.slow&&!st.fin[idxs[0]]){ ctx.font='900 22px "Big Shoulders Display",Impact,sans-serif'; ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(W/2-72,6,144,26); ctx.fillStyle=(fr%24<14)?C.gold:'#fff'; ctx.fillText('PHOTO FINISH',W/2,19.5); }

    // leaderboard
    lastBoard+=dt;
    if(lastBoard>0.1){
      lastBoard=0;
      rows.forEach(function(r,i){
        var el=$('#br'+i); if(!el) return;
        el.style.transform='translateY('+(rank[i]*44)+'px)';
        el.querySelector('.pos').textContent=st.fin[i]?ord(r.rank):String(rank[i]+1);
        var gapEl=el.querySelector('.gap');
        gapEl.textContent=st.fin[i]?'Finished':tau<0?'':rank[i]===0?'Leader':'−'+((P[idxs[0]]-P[i])*12.86).toFixed(1)+' len';
      });
    }
  });
};

    '<div class="actions"><button type="button" class="btn hot" data-act="newrace">Start another race</button><button type="button" class="btn alt" data-act="again">Watch it again</button></div>';

  'rand':function(){
    var used=S.game.seats.map(function(s){return s.name.toLowerCase();}), nm;
    do{nm=pick(HORSES);}while(used.indexOf(nm.toLowerCase())>=0);
    var inp=$('#horseName'); inp.value=nm; onName(); inp.focus({preventScroll:true});
  },
  'note':function(){ noteName(); },
  'tried':function(el){ var inp=$('#horseName'); inp.value=el.dataset.name; onName(); inp.focus({preventScroll:true}); },
  'enter':function(){ enterRace(); },
  'copycode':function(){ copyText(S.game.code,'Race code copied'); },
  'fill':function(){ fillNow(); },
  'reveal':function(){ revealMine(); },
  'watch':function(el){ fakeTx(el,['Confirm in your wallet…','Starting the race…'],function(){ go('race'); }); },
  'skip':function(){
    var G=S.game;
    if(!S.race){ G.seats.forEach(function(s){s.revealed=true;}); checkAllRevealed(); }
    go('result');
  },
  'result':function(){ go('result'); },
  'again':function(){ go('race'); },
  'newrace':function(){ S.game=null; S.race=null; S.settled=false; go('lobby'); },
  'copyresult':function(){ copyText(shareText(),'Result copied'); }
};
function startOpen(o){
  S.game=newGame({code:o.code,n:o.n,stake:o.stake,host:o.host,taken:o.taken}); S.race=null; S.settled=false; go('stable');
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  var f=ACT[el.dataset.act]; if(f) f(el);
});
document.addEventListener('input',function(e){ if(e.target&&e.target.id==='horseName') onName(); if(e.target&&e.target.id==='stakeIn') readStake(); });
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='horseName'){ e.preventDefault(); var eb=$('#enterBtn'); if(eb&&!eb.disabled) enterRace(); }
  if(e.key==='Enter'&&e.target&&e.target.id==='codeIn'){ e.preventDefault(); ACT.joincode(); }
});

go('lobby');
})();
</script>

</body></html>
